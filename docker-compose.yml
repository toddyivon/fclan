services:
  fclan-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fclan-web
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # WEB_PORT=3001 for side-by-side smoke tests next to the old gt7-web:3000.
      - "${WEB_PORT:-3000}:3000"
    networks:
      - fclan-network
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fclan-network:
    driver: bridge
